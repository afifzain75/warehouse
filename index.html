<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e90d6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gudang">
<title>Gudang</title>
<style>
:root{--bg:#f1f7fb;--card:#fff;--ink:#0f3556;--mut:#56748b;--line:#cfe2ef;--acc:#1e90d6;--hd:#1e90d6;--lt:#8dc8e8;--pri:#1a7fc4;--in:#1a7fc4;--out:#c2410c;--r:10px}
@media(prefers-color-scheme:dark){:root{--bg:#0a1a29;--card:#112739;--ink:#e6f1f9;--mut:#8fb0c7;--line:#1f3f5a;--hd:#14527f}}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-top:env(safe-area-inset-top,0)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--hd);color:#fff;border-bottom:4px solid var(--lt)}
header b{font-size:18px}
header button{background:none;border:1px solid #ffffff55;color:#fff;border-radius:8px;padding:6px 10px;font:inherit;font-size:14px}
main{padding:16px 16px 100px;max-width:560px;margin:0 auto}
h2{margin:0 0 12px;font-size:20px}
p{margin:0 0 8px}
label{display:block;font-size:14px;color:var(--mut);margin:12px 0 4px}
input,select{width:100%;font:inherit;padding:12px;border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--ink)}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:var(--r);font:inherit;font-weight:700;color:#fff;background:var(--pri)}
.btn.in{background:var(--in)}.btn.out{background:var(--out)}
.btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.sku,.hint{color:var(--mut);font-size:13px}
.tot{font-weight:700;font-size:20px}
.locs{margin-top:6px;font-size:14px}
.locs span{display:inline-block;margin:2px 8px 2px 0;padding:2px 8px;border:1px solid var(--line);border-radius:6px}
.low,.errs{color:var(--out);font-size:13px;font-weight:700}
.errs div{font-weight:400;margin-top:2px}
.empty{color:var(--mut);text-align:center;padding:24px 0}
.sec{margin-bottom:32px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0)}
nav button{flex:1;padding:12px 2px;border:0;background:none;color:var(--mut);font:inherit;font-size:12px;border-top:3px solid transparent}
nav button.on{color:var(--ink);font-weight:700;border-top-color:var(--acc)}
#toast{position:fixed;left:16px;right:16px;bottom:80px;padding:12px 14px;border-radius:var(--r);background:var(--ink);color:#fff;display:none;z-index:9}
#toast.err{background:var(--out)}
#login{max-width:360px;margin:12vh auto;padding:0 16px}

.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;text-align:left;font:inherit;color:var(--ink);transition:transform .15s,border-color .2s}
button.kpi{cursor:pointer}.kpi:active{transform:scale(.97)}
.kpi small{display:block;color:var(--mut);font-size:13px}
.kpi b{font-size:26px;display:block}
.kpi.warn b{color:var(--out)}
.low-list{overflow:hidden;max-height:0;transition:max-height .4s ease}
.low-list.open{max-height:700px}
.legend{display:flex;gap:12px;font-size:12px;color:var(--mut);margin:6px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px}
.bi{background:var(--pri)}.bo{background:var(--out)}
.bars{display:flex;gap:6px;height:170px}
.day{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;cursor:pointer}
.pair{display:flex;gap:3px;align-items:flex-end;height:140px;width:100%;justify-content:center}
.b{display:block;width:40%;max-width:16px;height:0;min-height:2px;border-radius:4px 4px 0 0;transition:height .8s cubic-bezier(.2,.8,.2,1)}
.bars.go .b{height:var(--h)}
.day span{font-size:11px;color:var(--mut);margin-top:6px;white-space:nowrap}
.day.sel span{color:var(--ink);font-weight:700}
.hrow{display:flex;align-items:center;gap:8px;margin:10px 0;font-size:14px;cursor:pointer}
.hrow span{width:64px;overflow:hidden;text-overflow:ellipsis}
.track{flex:1;height:10px;border-radius:6px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--acc);transition:width .8s cubic-bezier(.2,.8,.2,1)}
.go .track i{width:var(--w)}
.boot{display:flex;flex-direction:column;align-items:center;justify-content:center;height:70vh;color:var(--mut)}
.boot i{width:36px;height:36px;border:4px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:12px}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes toastin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes spin{to{transform:rotate(360deg)}}
main{animation:up .28s ease both}
#ls.anim .card{animation:up .3s ease both}
#ls.anim .card:nth-child(2){animation-delay:.04s}#ls.anim .card:nth-child(3){animation-delay:.08s}
#ls.anim .card:nth-child(4){animation-delay:.12s}#ls.anim .card:nth-child(5){animation-delay:.16s}
#ls.anim .card:nth-child(n+6){animation-delay:.2s}
.card label,.card input,.card select{animation:fade .25s ease both}
.btn{transition:transform .12s,opacity .2s}.btn:active{transform:scale(.98)}
#toast{animation:toastin .25s ease}
nav button{transition:color .2s,border-color .2s}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
.x{border:0;background:none;color:var(--out);font:inherit;font-size:18px;padding:2px 6px;margin-left:6px;cursor:pointer}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
// ====== ISI DUA BARIS INI (Supabase > Project Settings > API) ======
const SB_URL = 'https://pghvtzfyuxhafdnmwsfh.supabase.co';
const SB_KEY = 'sb_publishable_C6hAkHr94fiLXlNY5ypV_w_rvHXx4QN';
// ==================================================================

function fatal(msg) {
  document.getElementById('app').innerHTML = '<div style="padding:24px;color:#ff9a6b;font:16px/1.5 system-ui"><b>Aplikasi tidak bisa dimulai</b><p>' + msg + '</p></div>';
  throw new Error(msg);
}
window.addEventListener('error', e => { if (!window.__ok) { try { fatal(String(e.message)); } catch (x) {} } });
if (typeof supabase === 'undefined') fatal('Library Supabase gagal dimuat. Periksa koneksi internet atau matikan ad blocker, lalu muat ulang (Ctrl+F5).');
if (!/^https:\/\/[a-z0-9-]+\.supabase\.co$/.test(SB_URL)) fatal('SB_URL belum benar. Isi persis seperti https://xxxx.supabase.co, tanpa garis miring atau tambahan di belakangnya.');
if (!SB_KEY || SB_KEY.indexOf('ISI_') === 0 || /\s/.test(SB_KEY)) fatal('SB_KEY belum diisi. Tempel Publishable key dari Supabase (Project Settings > API Keys).');
const sb = supabase.createClient(SB_URL, SB_KEY);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let items = [], locs = [], stock = [], tab = 'home', user = null, pending = null, isAdmin = false;

try {
  const icon = 'data:image/svg+xml,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#1e90d6"/><rect x="22" y="30" width="56" height="42" fill="#ffffff"/><path d="M22 46h56" stroke="#1e90d6" stroke-width="5"/></svg>');
  const m = {name:'Inventory Gudang',short_name:'Gudang',display:'standalone',start_url:location.href,background_color:'#1e90d6',theme_color:'#1e90d6',icons:[{src:icon,sizes:'512x512',type:'image/svg+xml'}]};
  const l = document.createElement('link'); l.rel = 'manifest';
  l.href = URL.createObjectURL(new Blob([JSON.stringify(m)], {type:'application/json'}));
  document.head.appendChild(l);
} catch (e) {}

function toast(t, err) {
  const el = $('#toast'); el.textContent = t; el.className = err ? 'err' : '';
  el.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(() => el.style.display = 'none', 3600);
}
const opts = (arr, fn, first) => (first ? `<option value="">${first}</option>` : '') + arr.map(x => `<option value="${x.id}">${esc(fn(x))}</option>`).join('');
const total = id => stock.filter(s => s.item_id === id).reduce((a, s) => a + s.qty, 0);
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
const locCode = id => (locs.find(l => l.id === id) || {}).code || '?';

// Supabase membatasi 1000 baris per permintaan, jadi diambil bertahap
async function all(tbl, mod) {
  let out = [], from = 0;
  for (;;) {
    const { data, error } = await mod(sb.from(tbl).select('*')).range(from, from + 999);
    if (error) throw error;
    out = out.concat(data);
    if (data.length < 1000) return out;
    from += 1000;
  }
}
async function load() {
  try {
    [items, locs, stock] = await Promise.all([
      all('items', q => q.order('name').order('id')),
      all('locations', q => q.order('code')),
      all('stock', q => q.gt('qty', 0).order('item_id').order('location_id'))
    ]);
  } catch (e) { toast('Gagal memuat data: ' + e.message, true); }
  const r = await sb.rpc('is_admin'); isAdmin = !r.error && r.data === true;
}

function shell(body) {
  const tabs = [['home','Beranda'],['stok','Stok'],['in','Terima'],['out','Keluar'],['lok','Lokasi'],['data','Data']];
  $('#app').innerHTML = `<header><b>Gudang${isAdmin ? ' · Admin' : ''}</b><button id="lo">Keluar akun</button></header>
  <main>${body}</main>
  <nav>${tabs.map(([k, n]) => `<button data-t="${k}" class="${tab === k ? 'on' : ''}">${n}</button>`).join('')}</nav>`;
  $('#lo').onclick = () => sb.auth.signOut();
  document.querySelectorAll('nav button').forEach(b => b.onclick = () => { tab = b.dataset.t; pending = null; openMove = null; openAdj = null; render(); });
}
function render() {
  if (!user) return renderLogin();
  ({home: viewHome, stok: viewStock, in: viewIn, out: viewOut, lok: viewLoc, data: viewData})[tab]();
}
function renderLogin() {
  $('#app').innerHTML = `<div id="login"><h2>Masuk ke Gudang</h2>
  <label>ID pengguna</label><input id="em" autocomplete="username" autocapitalize="none" placeholder="contoh: @Afifzain75">
  <label>Kata sandi</label><input id="pw" type="password" autocomplete="current-password">
  <button class="btn" id="go">Masuk</button></div>`;
  $('#go').onclick = async () => {
    const id = $('#em').value.trim().replace(/^@/, '').toLowerCase();
    const email = id.includes('@') ? id : id + '@gudang.app';
    const { error } = await sb.auth.signInWithPassword({ email, password: $('#pw').value });
    if (error) toast(/invalid login/i.test(error.message) ? 'ID atau kata sandi salah' : /not confirmed/i.test(error.message) ? 'Akun belum dikonfirmasi di Supabase' : 'Gagal masuk: ' + error.message, true);
  };
}

const flash = el => { el.classList.add('anim'); setTimeout(() => el.classList.remove('anim'), 700); };
function countUp(el, to) {
  const t0 = performance.now(), dur = 700;
  const step = t => { const p = Math.min(1, (t - t0) / dur); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))).toLocaleString('id-ID'); if (p < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
const afterPaint = fn => requestAnimationFrame(() => requestAnimationFrame(fn));

function viewHome() {
  const lowItems = items.filter(i => total(i.id) <= i.min_stock);
  const totalQty = stock.reduce((a, s) => a + s.qty, 0);
  const byLoc = {}; stock.forEach(s => { byLoc[s.location_id] = (byLoc[s.location_id] || 0) + s.qty; });
  const top = Object.entries(byLoc).sort((a, b) => b[1] - a[1]).slice(0, 5), mx = top.length ? top[0][1] : 1;
  shell(`<h2>Ringkasan</h2>
  <div class="kpis">
    <button class="kpi" data-go="stok"><small>Total Part No</small><b data-n="${items.length}">0</b></button>
    <div class="kpi"><small>Total Qty</small><b data-n="${totalQty}">0</b></div>
    <button class="kpi ${lowItems.length ? 'warn' : ''}" id="lowb"><small>Stok menipis (ketuk)</small><b data-n="${lowItems.length}">0</b></button>
    <div class="kpi"><small>Transaksi hari ini</small><b id="tdy">…</b></div>
  </div>
  <div class="low-list" id="lowl">${lowItems.slice(0, 8).map(i => `<div class="card row"><div><b>${esc(i.name)}</b><div class="sku">${esc(i.sku)}</div></div><div class="low">${total(i.id)} / min ${i.min_stock}</div></div>`).join('')}${lowItems.length > 8 ? `<div class="hint" style="margin-bottom:10px">dan ${lowItems.length - 8} lainnya di tab Stok</div>` : ''}</div>
  <div class="card"><b>Masuk dan keluar, 7 hari terakhir</b>
    <div class="legend"><span><i class="bi"></i>Masuk</span><span><i class="bo"></i>Keluar</span></div>
    <div id="ch" class="hint">Memuat grafik…</div></div>
  <div class="card" id="tl"><b>5 lokasi dengan stok terbanyak</b>
    ${top.length ? top.map(([id, q]) => `<div class="hrow" data-loc="${id}"><span>${esc(locCode(id))}</span><div class="track"><i style="--w:${q / mx * 100}%"></i></div><b>${q}</b></div>`).join('') : '<div class="empty">Belum ada stok.</div>'}</div>`);
  document.querySelectorAll('[data-n]').forEach(el => countUp(el, +el.dataset.n));
  afterPaint(() => { const t = $('#tl'); if (t) t.classList.add('go'); });
  $('#lowb').onclick = () => $('#lowl').classList.toggle('open');
  document.querySelectorAll('[data-go]').forEach(b => b.onclick = () => { tab = b.dataset.go; render(); });
  document.querySelectorAll('[data-loc]').forEach(r => r.onclick = () => { selLoc = r.dataset.loc; tab = 'lok'; render(); });
  (async () => {
    try {
      const since = new Date(); since.setDate(since.getDate() - 6); since.setHours(0, 0, 0, 0);
      const mv = await all('movements', q => q.gte('created_at', since.toISOString()).order('created_at').order('id'));
      if (tab !== 'home' || !$('#ch')) return;
      const days = [];
      for (let k = 6; k >= 0; k--) { const d = new Date(); d.setDate(d.getDate() - k); days.push({ key: d.toDateString(), label: d.toLocaleDateString('id-ID', { weekday: 'short' }) + ' ' + d.getDate(), inn: 0, out: 0 }); }
      let cnt = 0;
      mv.forEach(m => {
        if (m.type !== 'IN' && m.type !== 'OUT') return;
        const d = days.find(x => x.key === new Date(m.created_at).toDateString()); if (!d) return;
        if (m.type === 'IN') d.inn += m.qty; else d.out += m.qty;
        if (d === days[6]) cnt++;
      });
      countUp($('#tdy'), cnt);
      const max = Math.max(1, ...days.flatMap(d => [d.inn, d.out]));
      $('#ch').className = '';
      $('#ch').innerHTML = `<div class="bars">${days.map((d, k) => `<div class="day" data-k="${k}"><div class="pair"><i class="b bi" style="--h:${d.inn / max * 100}%"></i><i class="b bo" style="--h:${d.out / max * 100}%"></i></div><span>${esc(d.label)}</span></div>`).join('')}</div><div class="hint" id="cv" style="margin-top:8px">Ketuk satu hari untuk melihat rincian</div>`;
      $('#ch').onclick = e => {
        const el = e.target.closest('.day'); if (!el) return;
        const d = days[+el.dataset.k];
        document.querySelectorAll('.day').forEach(x => x.classList.toggle('sel', x === el));
        $('#cv').textContent = `${d.label}: masuk ${d.inn}, keluar ${d.out}`;
      };
      afterPaint(() => { const b = $('.bars'); if (b) b.classList.add('go'); });
    } catch (err) { if ($('#ch')) $('#ch').textContent = 'Grafik tidak bisa dimuat'; if ($('#tdy')) $('#tdy').textContent = '-'; }
  })();
}

let openAdj = null;
function viewStock() {
  shell(`<h2>Cek stok</h2><input id="q" placeholder="Cari nama atau SKU" type="search"><div id="ls" style="margin-top:12px"></div>`);
  const draw = () => {
    const q = $('#q').value.toLowerCase();
    const rows = items.filter(i => (i.name + i.sku + (i.material_no || '')).toLowerCase().includes(q));
    $('#ls').innerHTML = rows.length ? rows.slice(0, 100).map(i => {
      const t = total(i.id), ss = stock.filter(s => s.item_id === i.id);
      const adj = !isAdmin ? '' : openAdj === i.id
        ? `<label>Lokasi</label><select id="al">${opts(locs, l => { const s = ss.find(x => x.location_id === l.id); return `${l.code} (stok ${s ? s.qty : 0})`; }, 'Pilih lokasi')}</select>
           <label>Jumlah sebenarnya (hasil hitung)</label><input id="aq" type="number" inputmode="numeric" min="0">
           <label>Alasan (wajib)</label><input id="ar" placeholder="contoh: stock opname">
           <button class="btn" data-aok="${i.id}">Simpan penyesuaian</button>
           <button class="btn ghost" data-acancel="1">Batal</button>`
        : `<button class="btn ghost" data-adj="${i.id}">Sesuaikan stok</button>`;
      return `<div class="card"><div class="row"><div><b>${esc(i.name)}</b><div class="sku">${esc(i.sku)}${i.material_no ? ' · Mat ' + esc(i.material_no) : ''}</div></div>
      <div class="tot">${t} <small>${esc(i.unit)}</small></div></div>
      ${t <= i.min_stock ? '<div class="low">Stok menipis</div>' : ''}
      <div class="locs">${ss.length ? ss.map(s => `<span>${esc(locCode(s.location_id))}: ${s.qty}</span>`).join('') : 'Belum ada stok'}</div>${adj}</div>`;
    }).join('') + (rows.length > 100 ? `<div class="hint">Menampilkan 100 dari ${rows.length} barang. Persempit pencarian.</div>` : '')
      : `<div class="empty">${items.length ? 'Barang tidak ditemukan.' : 'Belum ada barang. Impor data penerimaan di tab Data.'}</div>`;
    if (openAdj && $('#al')) {
      const ss = stock.filter(s => s.item_id === openAdj);
      if (ss.length === 1) $('#al').value = ss[0].location_id;
    }
  };
  $('#q').oninput = draw;
  $('#ls').onclick = async e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.adj) { openAdj = b.dataset.adj; return draw(); }
    if (b.dataset.acancel) { openAdj = null; return draw(); }
    if (!b.dataset.aok) return;
    const loc = $('#al').value, nq = parseInt($('#aq').value, 10), why = $('#ar').value.trim();
    if (!loc || !Number.isInteger(nq) || nq < 0 || !why) return toast('Lengkapi lokasi, jumlah sebenarnya, dan alasan', true);
    b.disabled = true;
    const { error } = await sb.rpc('adjust_stock', { p_item: b.dataset.aok, p_loc: loc, p_new_qty: nq, p_reason: why });
    if (error) { b.disabled = false; return toast(error.message, true); }
    await load(); openAdj = null; toast('Penyesuaian tersimpan'); viewStock();
  };
  flash($('#ls'));
  draw();
}

const carts = { in: [], out: [] };
function viewIn() { viewTx(true); }
function viewOut() { viewTx(false); }
function viewTx(isIn) {
  const cart = carts[isIn ? 'in' : 'out'];
  shell(`<h2>${isIn ? 'Penerimaan barang' : 'Pengeluaran barang'}</h2>
  ${isIn ? '<p class="hint">Untuk barang atau lokasi baru, dan penerimaan dari file Excel, gunakan tab Data.</p>' : ''}
  <label>Cari barang</label><input id="fq" type="search" placeholder="Ketik Part No, Material No, atau nama">
  <label>Barang</label><select id="it"></select>
  <label>${isIn ? 'Simpan ke lokasi' : 'Ambil dari lokasi'}</label><select id="lc">${isIn ? opts(locs, l => l.code, 'Pilih lokasi') : '<option value="">Pilih barang dulu</option>'}</select>
  <label>Jumlah</label><input id="qt" type="number" inputmode="numeric" min="1">
  <button class="btn ghost" id="ad">+ Tambah ke daftar</button>
  <div id="cl" style="margin-top:12px"></div>
  <label>Tanggal transaksi</label><input id="dt" type="date" value="${today()}" max="${today()}">
  <label>${isIn ? 'Nomor surat jalan / catatan' : 'Tujuan / nomor pesanan'}</label><input id="nt">
  <button class="btn ${isIn ? 'in' : 'out'}" id="sv"></button>`);
  const fill = () => {
    const q = $('#fq').value.toLowerCase();
    const r = items.filter(i => (isIn || total(i.id) > 0) && (i.name + i.sku + (i.material_no || '')).toLowerCase().includes(q)).slice(0, 100);
    $('#it').innerHTML = opts(r, i => `${i.sku} · ${i.name}`, r.length ? 'Pilih barang' : 'Tidak ada barang');
    if (!isIn) $('#lc').innerHTML = '<option value="">Pilih barang dulu</option>';
  };
  const drawCart = () => {
    $('#cl').innerHTML = cart.length ? `<b>Daftar ${isIn ? 'penerimaan' : 'pengeluaran'} (${cart.length} baris)</b>` + cart.map((c, k) => {
      const i = items.find(x => x.id === c.item) || {};
      return `<div class="card row" style="margin-top:8px"><div><b>${esc(i.name)}</b><div class="sku">${esc(i.sku)} · ${esc(locCode(c.loc))}</div></div><div class="tot">${c.qty} <small>${esc(i.unit)}</small><button class="x" data-rm="${k}">✕</button></div></div>`;
    }).join('') : '';
    $('#sv').textContent = cart.length ? `Simpan semua (${cart.length} baris)` : (isIn ? 'Simpan penerimaan' : 'Simpan pengeluaran');
  };
  const addLine = () => {
    const it = $('#it').value, lc = $('#lc').value, qt = parseInt($('#qt').value, 10);
    if (!it || !lc || !qt || qt < 1) { toast('Pilih barang, lokasi, dan isi jumlah', true); return false; }
    const ex = cart.find(c => c.item === it && c.loc === lc), want = (ex ? ex.qty : 0) + qt;
    if (!isIn) {
      const s = stock.find(x => x.item_id === it && x.location_id === lc);
      if (!s || s.qty < want) { toast(`Stok di lokasi ini hanya ${s ? s.qty : 0}`, true); return false; }
    }
    if (ex) ex.qty = want; else cart.push({ item: it, loc: lc, qty: qt });
    $('#qt').value = ''; $('#fq').value = ''; fill(); drawCart();
    return true;
  };
  $('#fq').oninput = fill;
  if (!isIn) $('#it').onchange = () => {
    const rows = stock.filter(s => s.item_id === $('#it').value);
    $('#lc').innerHTML = rows.length ? opts(rows.map(s => ({ id: s.location_id, t: `${locCode(s.location_id)} (stok ${s.qty})` })), x => x.t, 'Pilih lokasi') : '<option value="">Tidak ada stok</option>';
  };
  $('#ad').onclick = addLine;
  $('#cl').onclick = e => { const b = e.target.closest('[data-rm]'); if (!b) return; cart.splice(+b.dataset.rm, 1); drawCart(); };
  $('#sv').onclick = async () => {
    if (($('#it').value || $('#qt').value) && !addLine()) return;
    if (!cart.length) return toast('Daftar masih kosong', true);
    const d = $('#dt').value;
    if (!d || d > today()) return toast('Tanggal transaksi tidak valid', true);
    $('#sv').disabled = true;
    const { error } = await sb.rpc('move_stock_bulk', { p_rows: cart.map(c => ({ item: c.item, loc: c.loc, qty: c.qty })), p_type: isIn ? 'IN' : 'OUT', p_note: $('#nt').value.trim() || null, p_date: d });
    if (error) { $('#sv').disabled = false; return toast(error.message, true); }
    const n = cart.length; cart.length = 0;
    await load(); toast(`${n} baris tersimpan`); viewTx(isIn);
  };
  fill(); drawCart();
}

let selLoc = '', openMove = null;
function viewLoc() {
  shell(`<h2>Cek lokasi</h2><select id="lc">${opts(locs, l => l.code, 'Pilih lokasi')}</select>
  <datalist id="dl">${locs.map(l => `<option value="${esc(l.code)}">`).join('')}</datalist>
  <div id="ls" style="margin-top:12px"></div>`);
  $('#lc').value = selLoc;
  const draw = () => {
    selLoc = $('#lc').value;
    const rows = stock.filter(s => s.location_id === selLoc);
    $('#ls').innerHTML = !selLoc ? '' : rows.length ? rows.map(s => {
      const i = items.find(x => x.id === s.item_id) || {};
      return `<div class="card"><div class="row"><div><b>${esc(i.name)}</b><div class="sku">${esc(i.sku)}${i.material_no ? ' · Mat ' + esc(i.material_no) : ''}</div></div><div class="tot">${s.qty} <small>${esc(i.unit)}</small></div></div>
      ${openMove === s.item_id
        ? `<label>Lokasi tujuan</label><input id="mt" list="dl" placeholder="pilih atau ketik lokasi baru" autocapitalize="characters">
           <label>Qty yang dipindahkan</label><input id="mq" type="number" inputmode="numeric" min="1" max="${s.qty}" value="${s.qty}">
           <button class="btn" data-ok="${s.item_id}">Simpan perpindahan</button>
           <button class="btn ghost" data-cancel="1">Batal</button>`
        : `<button class="btn ghost" data-mv="${s.item_id}">Pindahkan</button>`}</div>`;
    }).join('') : '<div class="empty">Lokasi ini kosong.</div>';
  };
  $('#lc').onchange = () => { openMove = null; flash($('#ls')); draw(); };
  $('#ls').onclick = async e => {
    const btn = e.target.closest('button'); if (!btn) return;
    if (btn.dataset.mv) { openMove = btn.dataset.mv; return draw(); }
    if (btn.dataset.cancel) { openMove = null; return draw(); }
    if (!btn.dataset.ok) return;
    const to = $('#mt').value.trim().toUpperCase(), q = parseInt($('#mq').value, 10);
    if (!to || !q || q < 1) return toast('Isi lokasi tujuan dan Qty', true);
    if (to === locCode(selLoc)) return toast('Lokasi tujuan sama dengan lokasi asal', true);
    btn.disabled = true;
    let dest = locs.find(l => l.code === to);
    if (!dest) {
      const r = await sb.from('locations').insert({ code: to }).select().single();
      if (r.error) { btn.disabled = false; return toast(r.error.message, true); }
      dest = r.data;
    }
    const { error } = await sb.rpc('move_location', { p_item: btn.dataset.ok, p_from: selLoc, p_to: dest.id, p_qty: q });
    if (error) { btn.disabled = false; return toast(error.message, true); }
    await load(); openMove = null; toast('Dipindahkan ke ' + to); viewLoc();
  };
  flash($('#ls'));
  draw();
}

// ---------- Impor & ekspor Excel ----------
const ALIAS = {
  sku: ['part no', 'part no.', 'part number', 'partnumber', 'sku', 'kode barang'],
  material: ['material no', 'material no.', 'material number', 'material_no', 'material'],
  name: ['desc', 'description', 'deskripsi', 'nama', 'nama barang'],
  qty: ['qty', 'quantity', 'jumlah'],
  unit: ['uom', 'satuan', 'unit'],
  loc: ['location', 'lokasi'],
  min_stock: ['min_stok', 'min stok', 'min_stock'],
  note: ['remarks', 'remark', 'catatan', 'keterangan', 'note', 'no surat jalan']
};
function parseRows(raw) {
  const known = new Set(items.map(i => i.sku)), newSku = new Set(), newLoc = new Set(), errs = [], rows = [];
  const have = new Set(locs.map(l => l.code));
  raw.forEach((r, idx) => {
    const n = {}; for (const k in r) n[String(k).trim().toLowerCase()] = r[k];
    const o = {}; for (const f in ALIAS) for (const a of ALIAS[f]) if (n[a] !== undefined && String(n[a]).trim() !== '') { o[f] = String(n[a]).trim(); break; }
    const line = idx + 2, loc = (o.loc || '').toUpperCase();
    if (!o.sku) return errs.push(`Baris ${line}: Part No kosong`);
    if (!loc) return errs.push(`Baris ${line}: Location kosong`);
    const q = Number(o.qty);
    if (!Number.isInteger(q) || q < 1) return errs.push(`Baris ${line}: Qty harus bilangan bulat lebih dari 0`);
    if (!known.has(o.sku) && !newSku.has(o.sku)) {
      if (!o.name) return errs.push(`Baris ${line}: Part No ${o.sku} baru, kolom Desc wajib diisi`);
      newSku.add(o.sku);
    }
    if (!have.has(loc)) newLoc.add(loc);
    rows.push({ sku: o.sku, material_no: o.material || '', name: o.name || '', unit: o.unit || '', min_stock: parseInt(o.min_stock, 10) || 0, loc, qty: q, note: o.note || '' });
  });
  return { rows, errs, newSku: newSku.size, newLoc: newLoc.size };
}
function download(sheets, name) {
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, d]) => XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(d), n));
  XLSX.writeFile(wb, `${name}_${new Date().toISOString().slice(0, 10)}.xlsx`);
}

function viewData() {
  shell(`<div class="sec"><h2>Penerimaan dari Excel</h2>
  <p class="hint">Kolom file: Part No, Material No, Desc, Qty, UoM, Location, Remarks. Part No dipakai sebagai kode unik barang. Barang dan lokasi baru dibuat otomatis.</p>
  <button class="btn ghost" id="tpl">Unduh template Excel</button>
  <label>Pilih file (.xlsx atau .csv)</label><input id="fl" type="file" accept=".xlsx,.xls,.csv">
  <div id="pv" style="margin-top:12px"></div></div>
  <div class="sec"><h2>Ekspor ke Excel</h2>
  <button class="btn ghost" id="e1">Stok saat ini</button>
  <button class="btn ghost" id="e2">Riwayat transaksi</button></div>`);
  $('#tpl').onclick = () => download([['Penerimaan', [{ 'Part No': 'KRD-001', 'Material No': 'MAT-0001', 'Desc': 'Kardus 40x30', 'Qty': 100, 'UoM': 'pcs', 'Location': 'A-01-1', 'Remarks': 'SJ-0001' }]]], 'template_penerimaan');
  let raw = null;
  const preview = () => {
    if (!raw) return;
    const p = parseRows(raw);
    $('#pv').innerHTML = `<div class="card"><b>${p.rows.length} baris valid</b>
      <div class="sku">${p.newSku} Part No baru · ${p.newLoc} lokasi baru</div>
      ${p.errs.length ? `<div class="errs" style="margin-top:8px">${p.errs.length} baris bermasalah, perbaiki lalu coba lagi:${p.errs.slice(0, 10).map(x => `<div>${esc(x)}</div>`).join('')}${p.errs.length > 10 ? `<div>dan ${p.errs.length - 10} lainnya</div>` : ''}</div>` : ''}</div>
      <button class="btn in" id="go" ${p.errs.length || !p.rows.length ? 'disabled' : ''}>Proses penerimaan (${p.rows.length} baris)</button>`;
    $('#go').onclick = async () => {
      $('#go').disabled = true;
      for (let i = 0; i < p.rows.length; i += 500) {
        const { error } = await sb.rpc('receive_bulk', { p_rows: p.rows.slice(i, i + 500) });
        if (error) { await load(); $('#go').disabled = false; return toast('Gagal: ' + error.message, true); }
      }
      await load(); toast(`${p.rows.length} baris berhasil diterima`); viewData();
    };
  };
  $('#fl').onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const wb = XLSX.read(await f.arrayBuffer(), { type: 'array' });
      raw = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval: '' });
      if (!raw.length) { raw = null; return toast('File kosong', true); }
    } catch (err) { return toast('File tidak bisa dibaca: ' + err.message, true); }
    preview();
  };
  $('#e1').onclick = () => download([
    ['Stok per lokasi', stock.map(s => { const i = items.find(x => x.id === s.item_id) || {}; return { 'Part No': i.sku, 'Material No': i.material_no || '', Desc: i.name, UoM: i.unit, Lokasi: locCode(s.location_id), Qty: s.qty }; })],
    ['Total per barang', items.map(i => ({ 'Part No': i.sku, 'Material No': i.material_no || '', Desc: i.name, UoM: i.unit, Total: total(i.id), 'Batas menipis': i.min_stock }))]
  ], 'stok');
  $('#e2').onclick = async () => {
    try {
      const mv = await all('movements', q => q.order('created_at', { ascending: false }).order('id', { ascending: false }));
      download([['Riwayat', mv.map(m => { const i = items.find(x => x.id === m.item_id) || {}; return { Waktu: new Date(m.created_at).toLocaleString('id-ID'), Diinput: new Date(m.entered_at || m.created_at).toLocaleString('id-ID'), Tipe: ({ IN: 'Masuk', OUT: 'Keluar', MOVE_OUT: 'Pindah keluar', MOVE_IN: 'Pindah masuk', ADJ_IN: 'Koreksi tambah', ADJ_OUT: 'Koreksi kurang' })[m.type] || m.type, 'Part No': i.sku, 'Material No': i.material_no || '', Desc: i.name, Lokasi: locCode(m.location_id), Qty: m.qty, Remarks: m.note || '', Petugas: m.user_email || '' }; })]], 'riwayat');
    } catch (err) { toast('Gagal ekspor: ' + err.message, true); }
  };
}

// Jangan memanggil Supabase langsung di dalam callback ini (bisa macet), jadi ditunda dengan setTimeout
sb.auth.onAuthStateChange((evt, session) => {
  const was = user;
  user = session ? session.user : null;
  if (evt === 'TOKEN_REFRESHED' || evt === 'USER_UPDATED') return;
  if (evt === 'SIGNED_IN' && user && was && was.id === user.id) return;
  setTimeout(async () => {
    if (user) { $('#app').innerHTML = '<div class="boot"><i></i>Memuat data…</div>'; await load(); }
    render();
  }, 0);
});
window.__ok = true;
